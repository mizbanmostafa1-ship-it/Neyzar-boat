<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اسکله تعاونی قایقرانان نیزار | تور قایق‌سواری بندر انزلی</title>
<meta name="description" content="رزرو تور قایق‌سواری اسکله تعاونی قایقرانان نیزار در بندر انزلی">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:#f4f8f8;
  color:#173b43;
  line-height:1.8;
}
.hero{
  background:linear-gradient(135deg,#075b68,#0b8a91);
  color:white;
  text-align:center;
  padding:55px 20px;
}
.hero h1{margin:0 0 12px;font-size:30px}
.hero p{margin:0;font-size:17px}
.container{max-width:1000px;margin:auto;padding:25px 15px}
h2{text-align:center;margin:10px 0 25px}
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:15px;
}
.card{
  background:white;
  border-radius:16px;
  padding:22px;
  text-align:center;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
}
.card h3{margin-top:0}
.price{
  font-size:22px;
  font-weight:bold;
  color:#087c85;
}
.booking{
  background:white;
  border-radius:18px;
  padding:25px;
  margin-top:30px;
  box-shadow:0 4px 18px rgba(0,0,0,.08);
}
.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}
.field{display:flex;flex-direction:column}
.field label{margin-bottom:6px;font-weight:bold}
.field input,.field select{
  width:100%;
  padding:12px;
  border:1px solid #ccd9db;
  border-radius:10px;
  font-size:16px;
  background:white;
}
.full{grid-column:1/-1}
.date-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}
.total{
  margin-top:20px;
  padding:18px;
  background:#e8f7f7;
  border-radius:12px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
  color:#075b68;
}
button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:15px;
  margin-top:18px;
  background:#087c85;
  color:white;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}
button:active{transform:scale(.99)}
.info{
  margin-top:25px;
  background:#fff;
  border-radius:16px;
  padding:22px;
}
